<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sovereign Web Dashboard</title>
  <link rel="icon" href="./images/logo.svg" />
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/dashboard.css" />
  <link rel="stylesheet" href="./css/backtest.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Sovereign <span>Web</span></div>
    <div class="status-pill" id="status-pill">loading</div>
  </header>
  <main class="layout">
    <aside class="sidebar">
      <button data-tab="overview" class="tab active">Overview</button>
      <button data-tab="portfolio" class="tab">Portfolio</button>
      <button data-tab="backtest" class="tab">Backtest</button>
      <button data-tab="correlation" class="tab">Correlation</button>
      <button data-tab="settings" class="tab">Settings</button>
    </aside>
    <section class="content">
      <section class="panel active" id="panel-overview">
        <h1>Local Prototype</h1>
        <p>This static pack mirrors the active web/API bridge and is safe to load without live secrets.</p>
        <div id="metrics" class="metrics-grid"></div>
      </section>
      <section class="panel" id="panel-portfolio"></section>
      <section class="panel" id="panel-backtest"></section>
      <section class="panel" id="panel-correlation"></section>
      <section class="panel" id="panel-settings"></section>
    </section>
  </main>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/tabs.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/portfolio.js"></script>
  <script src="./js/backtest.js"></script>
  <script src="./js/correlation.js"></script>
  <script src="./js/analytics.js"></script>
  <script src="./js/settings.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
