version: "3.9"

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sovereign-trading-platform:local
    environment:
      NODE_ENV: production
      SOVEREIGN_WEB_HOST: 0.0.0.0
      SOVEREIGN_WEB_PORT: 8787
      SOVEREIGN_CACHE_TTL_MS: 30000
      SOVEREIGN_CACHE_MAX_ENTRIES: 100
      SOVEREIGN_SUPABASE_URL: ${SOVEREIGN_SUPABASE_URL:-}
      SOVEREIGN_SUPABASE_PUBLISHABLE_KEY: ${SOVEREIGN_SUPABASE_PUBLISHABLE_KEY:-}
      SOVEREIGN_SUPABASE_SECRET_KEY: ${SOVEREIGN_SUPABASE_SECRET_KEY:-}
    ports:
      - "8787:8787"
    volumes:
      - ../data:/app/data
      - ../workspace:/app/workspace
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
