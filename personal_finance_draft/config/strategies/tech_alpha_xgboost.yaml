engine: auto
name: tech_alpha_xgboost
kind: momentum
family: momentum
lane: single_asset
role: strategy
status: draft
enabled: true
model: xgboost
sections:
  hypothesis: "XGBoost-driven momentum for high-beta US technology stocks."
  universe:
    - AAPL
    - MSFT
    - NVDA
    - AMD
    - SMCI
  signals:
    entry: "Signal > 0.65"
    exit: "Hold 5 days"
  data:
    required_sources:
      - price_volume
      - sentiment
    validation: strict
  features:
    technical:
      - return_fast
      - return_slow
      - volatility
      - rsi
      - atr
      - bollinger
    relative: []
    orderflow: []
    custom: []
  indicators:
    return_fast: true
    return_slow: true
    volatility: true
    rsi: true
    atr: true
    bollinger: true
  indicator_periods:
    return_fast: 1
    return_slow: 5
    volatility: 20
    rsi: 14
    atr: 14
    bollinger: 20
  risk:
    signal_threshold: 0.65
    max_holding_days: 5
    risk_weight: 0.12
    fail_closed: true
  promotion:
    require_backtest: true
    require_walk_forward: true
  notes: []
