sources:
  equities:
    enabled: true
    providers: ["finnhub", "twelve", "stooq", "yahoo", "tradingview"]
    symbols: ["AAPL", "MSFT", "NVDA", "TSLA", "GOOGL", "META", "AMZN", "NFLX", "AMD", "BABA", "ARM", "MSTR", "COIN", "SMCI", "SPY", "QQQ", "IWM", "DIA", "ORCL", "SBUX", "NKE", "TMUS", "VCB", "BID", "CTG", "TCB", "FPT", "CMG", "VIC", "VHM", "VRE", "VNM", "MSN", "HPG", "FMC", "GAS"]
    universe_matrix:
      x_axis_markets: ["USA", "VN", "IN", "UK", "GER"]
      y_axis_sectors: ["technology", "financials", "energy", "healthcare", "mining", "automotive", "industrials", "real_estate", "consumer", "communication_services", "consumer_discretionary", "indices"]
      grid:
        USA:
          technology: ["AAPL", "MSFT", "NVDA", "AMD", "AVGO", "ORCL", "CRM", "ADBE", "MSTR", "SMCI"]
          financials: ["JPM", "BAC", "WFC", "GS", "MS"]
          communication_services: ["GOOGL", "META", "DIS", "TMUS", "VZ"]
          consumer_discretionary: ["TSLA", "AMZN", "NFLX", "SBUX", "NKE", "MCD"]
          indices: ["SPY", "QQQ"]
        VN:
          financials: ["VCB", "BID", "CTG", "TCB"]
          technology: ["FPT", "CMG"]
          real_estate: ["VIC", "VHM", "VRE"]
          consumer: ["VNM", "MSN"]
          industrials: ["HPG", "FMC"]
          energy: ["GAS"]
        IN:
          technology: ["TCS", "INFY", "WIPRO", "HCLTECH"]
          financials: ["HDFCBANK", "ICICIBANK", "SBIN", "KOTAKBANK"]
          energy: ["RELIANCE", "ONGC"]
          consumer: ["HINDUNILVR", "ITC"]
        UK:
          financials: ["HSBA", "BARC", "LLOY"]
          energy: ["BP", "SHEL"]
          healthcare: ["AZN", "GSK"]
          mining: ["RIO", "GLEN"]
        GER:
          technology: ["SAP", "IFX"]
          industrials: ["SIE", "DHL"]
          automotive: ["VOW3", "MBG", "BMW"]
          financials: ["ALV", "DBK"]
    timeframes: ["5m", "15m", "30m", "1h", "4h", "1d"]

  indices:
    enabled: true
    providers: ["twelve", "stooq", "yahoo", "fred"]
    symbols: ["SPX", "NDX", "DJI", "VIX", "IXIC", "RUT", "DAX", "FTSE", "FCHI", "N225", "HSI"]
    timeframes: ["5m", "15m", "30m", "1h", "4h", "1d"]

  commodities:
    enabled: true
    providers: ["twelve", "stooq", "yahoo"]
    symbols: ["XAUUSD", "XAGUSD", "XCUUSD", "USOIL", "UKOIL", "NG", "WHEAT", "CORN", "SOYBN"]
    timeframes: ["5m", "15m", "30m", "1h", "4h", "1d"]

  fx:
    enabled: true
    providers: ["finnhub", "twelve", "frankfurter", "fxapi", "ecb"]
    symbols: ["EURUSD", "EURJPY", "EURGBP", "GBPUSD", "USDJPY", "AUDUSD", "USDCAD", "USDCHF", "NZDUSD", "USDSEK"]
    timeframes: ["1d"]

  quote_feeds:
    enabled: true
    providers: ["headway_mt5", "mt5", "webull"]
    symbols: []
    timeframes: ["tick", "1m", "5m", "1d"]

  crypto:
    enabled: true
    providers: ["finnhub", "twelve", "binance", "coinbase", "coingecko", "tradingview"]
    symbols: ["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT", "SUIUSDT", "ADAUSDT", "LINKUSDT", "PEPEUSDT", "WIFUSDT", "SHIBUSDT", "FETUSDT", "POLUSDT", "AVAXUSDT", "NEARUSDT", "INJUSDT", "RNDRUSDT"]
    universe_matrix:
      x_axis_markets: ["GLOBAL"]
      y_axis_sectors: ["layer1", "exchange_tokens", "defi", "memes", "ai"]
      grid:
        GLOBAL:
          layer1: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "ADAUSDT", "AVAXUSDT", "NEARUSDT", "SUIUSDT", "POLUSDT", "DOTUSDT", "MATICUSDT"]
          exchange_tokens: ["BNBUSDT", "OKB", "KCS", "HT", "GT", "CROUSDT", "FTT"]
          defi: ["UNIUSDT", "AAVEUSDT", "LINKUSDT", "INJUSDT", "MKRUSDT", "SNXUSDT", "LDOUSDT"]
          memes: ["DOGEUSDT", "SHIBUSDT", "PEPEUSDT", "WIFUSDT", "FLOKIUSDT", "BONKUSDT"]
          ai: ["FETUSDT", "RNDRUSDT", "AGIXUSDT", "OCEANUSDT", "TAOUSDT"]
    timeframes: ["5m", "15m", "30m", "1h", "4h", "1d"]

  pmi:
    enabled: true
    providers: ["spglobal"]
    series: ["US_COMPOSITE", "US_MANUFACTURING", "US_SERVICES", "US_MANUFACTURING_OUTPUT"]

  macro:
    enabled: true
    providers: ["fred"]
    series: ["CPI", "PPI", "US02YIELD", "NFP", "ADP", "JOLTS", "JOBLESS_CLAIMS", "UNEMPLOYMENT_RATE", "GDP", "RETAIL_SALES", "CONSUMER_CONFIDENCE"]

  weather:
    enabled: true
    providers: ["nasa_power"]
    locations: ["us_gulf", "us_midwest", "europe_central"]
    metrics: ["T2M", "T2M_MAX", "T2M_MIN", "PRECTOTCORR", "WS10M", "ALLSKY_SFC_SW_DWN"]

  flight:
    enabled: true
    providers: ["opensky"]
    regions: ["us_gulf", "us_midwest", "europe_central"]
    metrics: ["aircraft_count", "avg_velocity", "avg_altitude", "on_ground_share"]

  crypto_tx:
    enabled: true
    providers: ["blockchair"]
    chains: ["bitcoin", "ethereum"]
    metrics: ["transactions_24h", "mempool_transactions", "mempool_total_fee_usd", "market_price_usd", "volume_24h"]

  sentiment:
    enabled: true
    providers: ["alternative_me"]
    fields: ["fear_and_greed", "fear_and_greed_classification"]

  holdings:
    enabled: true
    providers: ["sec"]
    symbols: ["AAPL", "MSFT"]
    metrics: ["sic", "recent_filing_count", "latest_filing_form", "latest_filing_date", "insider_transaction_flags"]

  reserves:
    enabled: true
    providers: ["world_bank"]
    countries: ["USA", "TUR", "CHN"]
    metrics: ["total_reserves_usd", "fuel_imports_pct", "fuel_exports_pct"]

  macro_alt:
    enabled: false
    providers: ["truflation"]
    series: ["US_CPI_HEADLINE", "US_CPI_FOOD", "US_CPI_HOUSING", "US_CPI_ENERGY", "US_PCE_HEADLINE"]

  satellite_nrt:
    enabled: false
    providers: ["firms"]
    areas: ["us_gulf", "us_west"]
    metrics: ["active_fires", "fire_radiative_power"]

  cargo:
    enabled: false
    providers: ["marinetraffic"]
    regions: ["us_gulf", "singapore_strait"]
    metrics: ["vessel_count", "avg_speed", "congestion_index"]

  onchain:
    enabled: true
    providers: ["blockchair"]
    chains: ["bitcoin", "ethereum"]
    metrics: ["transactions_24h", "mempool_transactions", "mempool_total_fee_usd", "market_price_usd", "volume_24h"]

  breadth:
    enabled: true
    providers: ["yahoo"]
    metrics: ["spy_rsp_ratio", "qqq_spy_ratio", "iwm_spy_ratio"]

  prediction_market:
    enabled: true
    providers: ["kalshi", "polymarket"]
    events: ["fed_rate_cut_prob", "us_recession_prob", "inflation_above_target", "risk_off_spike"]

fred_mappings:
  indices:
    NDX: "NASDAQCOM"
    DJI: "DJIA"
    VIX: "VIXCLS"
  macro:
    CPI: "CPIAUCSL"
    PPI: "PPIACO"
    US02YIELD: "DGS2"
    NFP: "PAYEMS"
    ADP: "ADPWNUSNERSA"
    JOLTS: "JTSJOL"
    JOBLESS_CLAIMS: "ICSA"
    UNEMPLOYMENT_RATE: "UNRATE"
    GDP: "GDP"
    RETAIL_SALES: "RSAFS"
    CONSUMER_CONFIDENCE: "UMCSENT"

breadth_ratios:
  spy_rsp_ratio: ["SPY", "RSP"]
  qqq_spy_ratio: ["QQQ", "SPY"]
  iwm_spy_ratio: ["IWM", "SPY"]

sec_ciks:
  AAPL: "0000320193"
  MSFT: "0000789019"

world_bank_mappings:
  total_reserves_usd: "FI.RES.TOTL.CD"
  fuel_imports_pct: "TM.VAL.FUEL.ZS.UN"
  fuel_exports_pct: "TX.VAL.FUEL.ZS.UN"

prediction_market_keywords:
  fed_rate_cut_prob: ["fed", "rate", "cut"]
  us_recession_prob: ["recession"]
  inflation_above_target: ["inflation", "cpi"]
  risk_off_spike: ["vix", "volatility", "recession", "crash"]

quality:
  reject_stale: true
  reject_lookahead: true
  max_missing_ratio: 0.01
  integrity_timeframes: ["1d"]
  # RNDRUSDT is migrated/delisted. VRE currently resolves only stale provider
  # data for the configured VN real-estate ticker until exchange-aware mapping exists.
  integrity_exceptions: ["RNDRUSDT", "VRE"]


