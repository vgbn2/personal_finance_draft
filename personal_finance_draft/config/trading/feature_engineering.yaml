features:
  technical:
    returns: [1, 5, 20, 60]
    volatility: [20, 60]
    indicators: ["rsi", "macd", "atr", "bollinger_bands"]
  macro:
    enabled: true
    fields: ["inflation", "policy_rate", "yield_curve_slope", "wage_growth", "consumer_sentiment", "real_time_inflation", "truflation_spread", "pmi_mfg", "pmi_srv"]
  holdings:
    enabled: true
    fields: ["insider_ownership", "institutional_ownership", "government_holding_share", "short_interest", "float"]
  reserves:
    enabled: true
    fields: ["gold_reserves", "fx_reserves", "oil_reserves", "strategic_petroleum", "import_dependency"]
  sentiment:
    enabled: true
    fields: ["news_score", "survey_score", "social_score", "prediction_probability", "onchain_flow", "breadth_score", "fear_and_greed"]
  weather:
    enabled: true
    fields: ["temperature", "temperature_min", "temperature_max", "precipitation", "wind_speed", "solar_radiation"]
  flight:
    enabled: true
    fields: ["aircraft_count", "avg_velocity", "avg_altitude", "on_ground_share"]
  satellite:
    enabled: false
    fields: ["active_fires", "fire_radiative_power", "cloud_cover", "smoke_index"]
  cargo:
    enabled: false
    fields: ["vessel_count", "avg_speed", "congestion_index"]
  onchain:
    enabled: true
    fields: ["transactions_24h", "mempool_transactions", "mempool_fee_pressure", "market_price", "volume_24h"]
  breadth:
    enabled: true
    fields: ["spy_rsp_ratio", "qqq_spy_ratio", "iwm_spy_ratio"]
  correlation:
    enabled: false
    fields: ["pairwise_returns", "cross_asset_corr", "vol_regime_corr", "lead_lag_score"]
kronos:
  lookback_window: 60
  horizon: 5
  use_hierarchical_tokens: true
  reject_incomplete_windows: true
