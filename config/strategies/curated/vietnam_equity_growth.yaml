engine: auto
name: vietnam_equity_growth
kind: momentum
family: momentum
lane: single_asset
role: strategy
status: draft
enabled: true
model: xgboost
sections:
  hypothesis: "Vietnam is a high-growth emerging market; momentum in financials and tech captures GDP-driven expansion with XGBoost structured features."
  universe:
    - VCB
    - FPT
    - HPG
  signals:
    entry: "Signal > 0.72"
    exit: "Hold 7 days"
  data:
    required_sources:
      - price_volume
      - macro
    validation: strict
  features:
    technical:
      - return_fast
      - return_slow
      - volatility
      - rsi
      - atr
      - bollinger
    relative: []
    orderflow: []
    custom: []
  indicators:
    return_fast: true
    return_slow: true
    volatility: true
    rsi: true
    atr: true
    bollinger: true
  indicator_periods:
    return_fast: 1
    return_slow: 5
    volatility: 20
    rsi: 14
    atr: 14
    bollinger: 20
  risk:
    signal_threshold: 0.72
    max_holding_days: 7
    risk_weight: 0.08
    fail_closed: true
  promotion:
    require_backtest: true
    require_walk_forward: true
  notes:
    - "v2: threshold raised 0.64→0.72, hold 5→7d, universe reduced to 3 most liquid"
    - "Backtest finding: cache had duplicate_record issue — re-run after sovereign check + refresh"
    - "VCB=financials, FPT=tech, HPG=industrials — diversified sector exposure"
    - "Target <150 trades/year to survive 5bps friction"
