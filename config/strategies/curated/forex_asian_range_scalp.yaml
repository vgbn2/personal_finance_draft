engine: auto
name: forex_asian_range_scalp
kind: mean_reversion
family: mean_reversion
lane: single_asset
role: strategy
status: draft
enabled: true
model: knn_pattern_v0
timeframe: 15m
sections:
  hypothesis: "Asian trading hours (00:00 - 07:00 GMT) display bounded range regimes with elevated mean-reversion probabilities on USDJPY, EURGBP, and AUDJPY."
  universe:
    - USDJPY
    - EURGBP
    - AUDJPY
  signals:
    entry: "Signal > 0.68"
    exit: "Hold 1 day or target Bollinger median reversion"
  data:
    required_sources:
      - price_volume
    validation: strict
  features:
    technical:
      - return_fast
      - return_slow
      - volatility
      - rsi
      - atr
      - bollinger
    relative: []
    orderflow: []
    custom: []
  indicators:
    return_fast: true
    return_slow: true
    volatility: true
    rsi: true
    atr: true
    bollinger: true
  indicator_periods:
    return_fast: 1
    return_slow: 5
    volatility: 20
    rsi: 14
    atr: 14
    bollinger: 20
  risk:
    signal_threshold: 0.68
    max_holding_days: 1
    risk_weight: 0.07
    fail_closed: true
  promotion:
    require_backtest: true
    require_walk_forward: true
    require_paper_trade: true
    review_required: true
  notes:
    - "MT5 Forex low-spread session mean reversion"
    - "Strict stop-loss bounds outside 2.5 standard deviation Bollinger bands"
