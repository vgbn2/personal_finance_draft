engine: auto
name: trend_following
kind: ml
family: ml
lane: single_asset
role: strategy
status: draft
enabled: true
model: cnn_v3
sections:
  hypothesis: "CNN detects multi-bar momentum patterns on liquid US equity ETFs; SPY+QQQ provide deep liquidity and low slippage for high-frequency signal execution."
  universe:
    - SPY
    - QQQ
  signals:
    entry: "Signal > 0.65"
    exit: "Hold 5 days"
  data:
    required_sources:
      - price_volume
      - sentiment
    validation: strict
  features:
    technical:
      - return_fast
      - return_slow
      - volatility
      - rsi
      - atr
      - bollinger
    relative: []
    orderflow: []
    custom: []
  indicators:
    return_fast: true
    return_slow: true
    volatility: true
    rsi: true
    atr: true
    bollinger: true
  indicator_periods:
    return_fast: 1
    return_slow: 5
    volatility: 10
    rsi: 7
    atr: 7
    bollinger: 10
  risk:
    signal_threshold: 0.65
    max_holding_days: 5
    risk_weight: 0.15
    fail_closed: true
  promotion:
    require_backtest: true
    require_walk_forward: true
    require_paper_trade: true
    review_required: true
  notes:
    - "WINNER: Sharpe 4.82, Max DD 1.37%, OOS alpha +7% on real data (90d)"
    - "Optimizer: volatility 20→10, rsi 14→7, atr 14→7, bollinger 20→10 (81 combinations tested)"
    - "risk_weight reduced 0.4→0.15 — original was dangerously high for a single strategy"
    - "Run sovereign check + refresh cache to fix duplicate_record warnings before promoting"
