engine: auto
name: ml_multi_asset
kind: ml
family: ml
lane: cross_asset
role: portfolio_optimization
status: draft
enabled: true
model: cnn_v3
sections:
  hypothesis: "Multi-asset ML strategy targeting high-conviction signals across Crypto, Equities, and Commodities."
  universe:
    - BTCUSDT
    - ETHUSDT
    - SPY
    - QQQ
    - XAUUSD
    - USOIL
  signals:
    entry: "Signal > 0.70"
    exit: "Hold 10 days"
  data:
    required_sources:
      - price_volume
      - sentiment
    validation: strict
  features:
    technical:
      - return_fast
      - return_slow
      - volatility
      - rsi
      - atr
      - bollinger
    relative: []
    orderflow: []
    custom: []
  indicators:
    return_fast: true
    return_slow: true
    volatility: true
    rsi: true
    atr: true
    bollinger: true
  indicator_periods:
    return_fast: 1
    return_slow: 5
    volatility: 20
    rsi: 14
    atr: 14
    bollinger: 20
  risk:
    signal_threshold: 0.52
    max_holding_days: 10
    risk_weight: 0.1
    fail_closed: true
  promotion:
    require_backtest: true
    require_walk_forward: true
  notes: []
