# Research and ML Pipeline Configuration

indicator_periods:
  return_fast: 1
  return_slow: 5
  volatility: 20
  rsi: 14
  atr: 14
  bollinger: 20

backtest_defaults:
  model: "cnn_window_v0"
  horizon: 5
  threshold: 0.55
  cost_bps: 5
  fee_bps: 2.5
  slippage_bps: 2.5
  train_ratio: 0.7
  tail_alpha: 0.05
  monte_carlo_runs: 1000

optimization_grid:
  rsi: [7, 14, 21]
  atr: [7, 14, 21]
  bollinger: [10, 20, 30]
  volatility: [10, 20, 60]

prediction_market:
  market_limit: 3
  period_minutes: 1440

historical_defaults:
  sample_size: 120
  fallback_days: 365
