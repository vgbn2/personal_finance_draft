name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: http://staging.polymarket-bot.example.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/polymarket-bot \
          bot=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ github.sha }} \
          --namespace=polymarket-staging
        kubectl rollout status deployment/polymarket-bot --namespace=polymarket-staging

    - name: Run health checks
      run: |
        ./scripts/health-check.sh staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: http://polymarket-bot.example.com
    needs: []
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

    - name: Create deployment backup
      run: |
        kubectl get deployment polymarket-bot -n polymarket-production -o yaml > backup-deployment-$(date +%s).yaml

    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/polymarket-bot \
          bot=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ github.sha }} \
          --namespace=polymarket-production
        kubectl rollout status deployment/polymarket-bot --namespace=polymarket-production --timeout=5m

    - name: Run health checks
      run: |
        ./scripts/health-check.sh production

    - name: Rollback on failure
      if: failure()
      run: |
        kubectl rollout undo deployment/polymarket-bot --namespace=polymarket-production

    - name: Notify deployment
      if: always()
      run: |
        echo "Deployment to production completed with status: ${{ job.status }}"
