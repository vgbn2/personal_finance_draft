apiVersion: v1
kind: Secret
metadata:
  name: polymarket-secrets
  namespace: polymarket-staging
type: Opaque
stringData:
  # API Keys - Replace with actual values or use external secrets manager
  POLYMARKET_API_KEY: "your-api-key-here"
  POLYMARKET_PRIVATE_KEY: "your-private-key-here"
  
  # Database credentials (if needed)
  DATABASE_URL: "postgresql://user:password@host:5432/polymarket"
  
  # Additional secrets
  SECRET_KEY: "your-secret-key-here"
---
apiVersion: v1
kind: Secret
metadata:
  name: polymarket-secrets
  namespace: polymarket-production
type: Opaque
stringData:
  # Production API Keys - Replace with actual values
  POLYMARKET_API_KEY: "your-production-api-key-here"
  POLYMARKET_PRIVATE_KEY: "your-production-private-key-here"
  
  # Database credentials
  DATABASE_URL: "postgresql://user:password@host:5432/polymarket_prod"
  
  # Additional secrets
  SECRET_KEY: "your-production-secret-key-here"
