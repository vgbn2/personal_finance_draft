# VPN-Safe & WSL-Compatible Network Configuration
# Ensures the dashboard and API are accessible even behind a VPN and avoids WSL conflicts.

server:
  # Use specific IP to avoid WSL/Windows localhost binding issues
  host: "0.0.0.0" 
  api_port: 8000      # Python Backend API
  ws_port: 8001       # Python WebSocket Bridge
  
databases:
  postgresql_port: 5432
  redis_port: 6379
  mongodb_port: 27017

frontend:
  dev_server_port: 3000
  proxy_url: "http://127.0.0.1:8000" # Use IP over 'localhost' for WSL consistency

# LAG & SYNCHRONIZATION
latency:
  max_acceptable_lag_ms: 500  # UI will warn if bridge lag exceeds this
  heartbeat_ms: 2000          # Frequency of VPN-health checks
  cache_ttl_seconds: 60       # Redis default TTL for non-critical lookups
