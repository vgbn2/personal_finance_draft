# ─── Symbols & Markets to Monitor ───
# This file defines the assets and markets the engine observes.

polymarket:
  # Event categories to scan
  categories:
    - "crypto"
    - "politics"
    - "economics"
    - "sports"
  
  # Specific market slugs to always monitor (if available)
  watchlist:
    - "will-bitcoin-hit-100k"
    - "fed-rate-decision"

binance:
  # Spot pairs for reference pricing
  spot:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
  
  # Futures pairs for IV/Greeks calculation
  futures:
    - "BTCUSDT"
    - "ETHUSDT"

deribit:
  # Options instruments for Implied Volatility
  instruments:
    - "BTC-PERPETUAL"
    - "ETH-PERPETUAL"
  
  # Currencies for options chain
  currencies:
    - "BTC"
    - "ETH"

macro:
  # Fed Watch indicators
  fed_watch:
    enabled: true
    source: "cme_fedwatch"
  
  # Crowd sentiment feeds
  sentiment:
    enabled: true
    sources:
      - "polymarket_volume"
      - "twitter_mentions"
