# Strategy and Risk Thresholds
# Centralized context for backend calculations.

risk_management:
  max_drawdown: 0.15          # 15% Max Drawdown limit
  black_swan_threshold: 0.05  # 5% probability triggers warning
  max_slippage: 0.02          # 2% max slippage rejection

backtest_params:
  initial_capital: 10000
  commission: 0.001           # 0.1% fee simulation
  monte_carlo_runs: 500

analytics_targets:
  min_sharpe_ratio: 1.5       # Target risk-adjusted return
  min_sortino_ratio: 2.0      # Target downside protection
  min_profit_factor: 1.3      # Target mathematical edge
  min_win_rate: 0.55          # Target win percentage
screener_filters:
  min_volume_24h: 50000       # US Dollars
  min_liquidity: 10000        # Minimum depth for slippage calc
  default_category: "Crypto"
