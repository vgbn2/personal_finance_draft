version: "3.9"

services:
  # Main App Service (Unified Nginx + Backend)
  terminus-app:
    build: .
    container_name: terminus-app-practice
    restart: unless-stopped
    ports:
      - "8080:80"        # Testing on 8080 to avoid conflict with main Terminus
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TERMINUS_API_KEY: ${TERMINUS_API_KEY:-terminus_practice_secret}
    networks:
      - terminus-net

  # TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: terminus-timescaledb-practice
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-terminus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-terminus_dev}
      POSTGRES_DB: ${DB_NAME:-terminus}
    volumes:
      - tsdb_data_practice:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-terminus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - terminus-net

  # Redis
  redis:
    image: redis:7-alpine
    container_name: terminus-redis-practice
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data_practice:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - terminus-net

volumes:
  tsdb_data_practice:
    driver: local
  redis_data_practice:
    driver: local

networks:
  terminus-net:
    driver: bridge
