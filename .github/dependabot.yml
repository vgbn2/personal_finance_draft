version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "eslint*"
      production-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/backend/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      api-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/backend/gateway"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "ethers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@alpacahq/alpaca-trade-api"
        update-types: ["version-update:semver-major"]
    groups:
      gateway-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/backend/mcp_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      mcp-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/Frontend/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions-dependencies:
        patterns:
          - "*"
