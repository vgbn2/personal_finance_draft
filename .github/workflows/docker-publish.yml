name: Build, Test, and Publish Docker Packages to GHCR

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-publish:
    name: Build, Test and Publish Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build All-in-One image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.allinone
          load: true
          tags: sovereign-allinone:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start All-in-One container
        run: |
          docker run -d --name sv-allinone-test \
            -p 8787:8787 \
            -e NODE_ENV=production \
            -e SOVEREIGN_WEB_HOST=0.0.0.0 \
            -e SOVEREIGN_WEB_PORT=8787 \
            -e SOVEREIGN_RUNTIME_MODE=local-compute \
            -e SOVEREIGN_ALLOW_LOCAL_GUEST=true \
            -e LIVE_TRADING=false \
            -e SOVEREIGN_EXECUTION_AUTHORIZED=false \
            sovereign-allinone:test

      - name: Verify All-in-One healthcheck and services
        run: |
          echo "Waiting for container HTTP /health endpoint..."
          PASSED=false
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Healthcheck passed on attempt $i (HTTP 200)"
              PASSED=true
              break
            fi
            echo "Attempt $i: HTTP status $STATUS, waiting 1s..."
            sleep 1
          done
          if [ "$PASSED" != "true" ]; then
            echo "=== CONTAINER FAILED HEALTHCHECK ==="
            docker ps -a
            echo "=== CONTAINER LOGS ==="
            docker logs sv-allinone-test
            exit 1
          fi

      - name: Test in-container CLI diagnostics
        run: |
          echo "Running CLI doctor inside All-in-One container..."
          docker exec sv-allinone-test node backend/cli/sovereign_cli.js doctor
          echo "Running CLI status inside All-in-One container..."
          docker exec sv-allinone-test node backend/cli/sovereign_cli.js status --json

      - name: Test in-container C++ core binary & Xvfb
        run: |
          echo "Checking C++ binary exists and is executable..."
          docker exec sv-allinone-test test -x /app/backend/core/build/sovereign_wealth
          echo "Checking Xvfb display server is running..."
          docker exec sv-allinone-test pgrep -f Xvfb

      - name: Gracefully stop All-in-One container
        run: |
          docker stop -t 10 sv-allinone-test
          docker rm sv-allinone-test

      - name: Build slim production image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: sovereign-slim:test
          cache-from: type=gha

      - name: Verify slim production container
        run: |
          docker run -d --name sv-slim-test \
            -p 8787:8787 \
            -e NODE_ENV=production \
            -e SOVEREIGN_WEB_HOST=0.0.0.0 \
            -e SOVEREIGN_WEB_PORT=8787 \
            -e SOVEREIGN_ALLOW_LOCAL_GUEST=true \
            sovereign-slim:test
          echo "Waiting for slim container /health endpoint..."
          PASSED=false
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Slim healthcheck passed on attempt $i (HTTP 200)"
              PASSED=true
              break
            fi
            echo "Attempt $i: HTTP status $STATUS, waiting 1s..."
            sleep 1
          done
          if [ "$PASSED" != "true" ]; then
            echo "=== SLIM CONTAINER FAILED HEALTHCHECK ==="
            docker ps -a
            echo "=== SLIM CONTAINER LOGS ==="
            docker logs sv-slim-test
            exit 1
          fi
          docker exec sv-slim-test node backend/cli/sovereign_cli.js doctor
          docker exec sv-slim-test test -x /app/backend/core/build/sovereign_wealth
          docker stop -t 10 sv-slim-test
          docker rm sv-slim-test

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Push All-in-One Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.allinone
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
