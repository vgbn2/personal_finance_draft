name: Build, Test, and Publish Docker Packages to GHCR

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_run:
    workflows: ["Release & Versioning"]
    types: [completed]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-publish:
    name: Build, Test and Publish Container
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build All-in-One image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.allinone
          load: true
          tags: sovereign-allinone:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start All-in-One container
        run: |
          docker run -d --name sv-allinone-test \
            -p 8787:8787 \
            -e NODE_ENV=production \
            -e SOVEREIGN_WEB_HOST=0.0.0.0 \
            -e SOVEREIGN_WEB_PORT=8787 \
            -e SOVEREIGN_RUNTIME_MODE=local-compute \
            -e SOVEREIGN_ALLOW_LOCAL_GUEST=true \
            -e LIVE_TRADING=false \
            -e SOVEREIGN_EXECUTION_AUTHORIZED=false \
            sovereign-allinone:test

      - name: Verify All-in-One healthcheck and services
        run: |
          echo "Waiting for container HTTP /health endpoint..."
          PASSED=false
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Healthcheck passed on attempt $i (HTTP 200)"
              PASSED=true
              break
            fi
            echo "Attempt $i: HTTP status $STATUS, waiting 1s..."
            sleep 1
          done
          if [ "$PASSED" != "true" ]; then
            echo "=== CONTAINER FAILED HEALTHCHECK ==="
            docker ps -a
            echo "=== CONTAINER LOGS ==="
            docker logs sv-allinone-test
            exit 1
          fi

      - name: Test in-container CLI diagnostics
        run: |
          echo "Running CLI doctor runtime inside All-in-One container..."
          docker exec sv-allinone-test node frontend/cli-tui/sovereign_cli.js doctor runtime
          echo "Running CLI doctor data inside All-in-One container..."
          docker exec sv-allinone-test node frontend/cli-tui/sovereign_cli.js doctor data
          echo "Running CLI status inside All-in-One container..."
          docker exec sv-allinone-test node frontend/cli-tui/sovereign_cli.js status --json
          echo "Running full broker doctor (informational in zero-key environment)..."
          docker exec sv-allinone-test node frontend/cli-tui/sovereign_cli.js doctor || true

      - name: Test in-container C++ core binary & Xvfb
        run: |
          echo "Checking C++ binary exists and is executable..."
          docker exec sv-allinone-test test -x /app/backend/cpp_core/build/sovereign_wealth
          echo "Checking Xvfb display server is running..."
          docker exec sv-allinone-test pgrep -f Xvfb

      - name: Gracefully stop All-in-One container
        run: |
          docker stop -t 10 sv-allinone-test
          docker rm sv-allinone-test

      - name: Build slim production image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: sovereign-slim:test
          cache-from: type=gha

      - name: Verify slim production container
        run: |
          docker run -d --name sv-slim-test \
            -p 8787:8787 \
            -e NODE_ENV=production \
            -e SOVEREIGN_WEB_HOST=0.0.0.0 \
            -e SOVEREIGN_WEB_PORT=8787 \
            -e SOVEREIGN_ALLOW_LOCAL_GUEST=true \
            sovereign-slim:test
          echo "Waiting for slim container /health endpoint..."
          PASSED=false
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Slim healthcheck passed on attempt $i (HTTP 200)"
              PASSED=true
              break
            fi
            echo "Attempt $i: HTTP status $STATUS, waiting 1s..."
            sleep 1
          done
          if [ "$PASSED" != "true" ]; then
            echo "=== SLIM CONTAINER FAILED HEALTHCHECK ==="
            docker ps -a
            echo "=== SLIM CONTAINER LOGS ==="
            docker logs sv-slim-test
            exit 1
          fi
          echo "Running CLI diagnostics inside slim container..."
          docker exec sv-slim-test node frontend/cli-tui/sovereign_cli.js doctor runtime
          docker exec sv-slim-test node frontend/cli-tui/sovereign_cli.js doctor data
          docker exec sv-slim-test node frontend/cli-tui/sovereign_cli.js status --json
          docker exec sv-slim-test node frontend/cli-tui/sovereign_cli.js doctor || true
          docker exec sv-slim-test test -x /app/backend/cpp_core/build/sovereign_wealth
          docker stop -t 10 sv-slim-test
          docker rm sv-slim-test

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Release Tag
        if: github.event_name != 'pull_request'
        id: resolve-tag
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [ -n "$TAG" ]; then
            echo "has_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "raw_version=$(echo "$TAG" | sed 's/^v//')" >> "$GITHUB_OUTPUT"
            echo "Detected release tag at HEAD: $TAG"
          else
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.resolve-tag.outputs.tag }},enable=${{ steps.resolve-tag.outputs.has_tag == 'true' }}
            type=raw,value=${{ steps.resolve-tag.outputs.raw_version }},enable=${{ steps.resolve-tag.outputs.has_tag == 'true' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Push All-in-One Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.allinone
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
