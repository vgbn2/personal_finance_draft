name: Code Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  static-analysis:
    name: Static Analysis & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/dashboard/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install dashboard dependencies
        run: npm --prefix frontend/dashboard ci --ignore-scripts

      - name: Run code audit & typecheck matrix
        run: npm run audit:code

      - name: Seed test fixtures and workspace skeleton
        run: |
          node backend/scripts/dev/seed_master_fixture.js
          node tools/dev/ensure_workspace_skeleton.js

      - name: Structure & documentation contracts
        run: npm run test:structure
