name: Release & Versioning

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
      - 'workspace/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Evaluate & Publish Release
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      release_created: ${{ steps.version.outputs.release_created }}
      new_version: ${{ steps.version.outputs.new_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Evaluate next version
        id: version
        env:
          BUMP_INPUT: ${{ inputs.bump || 'auto' }}
        run: |
          node scripts/ops/release_version.js --bump="$BUMP_INPUT" --apply --json > release_result.json
          cat release_result.json

          RELEASE_NEEDED=$(node -e "const r = JSON.parse(require('fs').readFileSync('release_result.json')); console.log(r.releaseNeeded);")
          NEW_VERSION=$(node -e "const r = JSON.parse(require('fs').readFileSync('release_result.json')); console.log(r.newVersion);")
          TAG_NAME=$(node -e "const r = JSON.parse(require('fs').readFileSync('release_result.json')); console.log(r.tag);")

          echo "release_created=$RELEASE_NEEDED" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE_NEEDED" = "true" ]; then
            node -e "const r = JSON.parse(require('fs').readFileSync('release_result.json')); require('fs').writeFileSync('RELEASE_NOTES.md', r.changelog);"
          fi

      - name: Commit and push tag
        if: steps.version.outputs.release_created == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.version.outputs.release_created == 'true'
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --notes-file RELEASE_NOTES.md
