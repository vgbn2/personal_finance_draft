name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  source-evidence:
    name: Committed source evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify committed archive across all package roots
        run: npm run verify:committed-archive -- --evidence-out "$RUNNER_TEMP/sovereign-source-evidence.json"

      - name: Retain source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-source-evidence
          path: ${{ runner.temp }}/sovereign-source-evidence.json
          if-no-files-found: error

  cpp-debug:
    name: C++ debug sanitizer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build/ci-debug -DCMAKE_BUILD_TYPE=Debug -DSOVEREIGN_ENABLE_SANITIZERS=ON -DSOVEREIGN_ENABLE_ONNX_RUNTIME=OFF

      - name: Build
        run: cmake --build build/ci-debug --parallel

      - name: Run CTest
        run: ctest --test-dir build/ci-debug/backend/core --output-on-failure

  node-tests:
    name: Node test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Frontend/dashboard/package-lock.json

      - name: Cache C++ core build
        id: cache-native-core
        uses: actions/cache@v4
        with:
          path: backend/core/build
          key: native-core-${{ runner.os }}-${{ hashFiles('backend/core/**', 'CMakeLists.txt') }}

      - name: Cache MCP server build
        id: cache-mcp-server
        uses: actions/cache@v4
        with:
          path: dist/mcp_server
          key: mcp-server-${{ runner.os }}-${{ hashFiles('backend/mcp_server/**') }}

      - name: Cache dashboard build
        id: cache-dashboard
        uses: actions/cache@v4
        with:
          path: |
            Frontend/dashboard/dist
            Frontend/dashboard/node_modules
          key: dashboard-dist-${{ runner.os }}-${{ hashFiles('Frontend/dashboard/package-lock.json', 'Frontend/dashboard/src/**', 'Frontend/dashboard/vite.config.*', 'Frontend/dashboard/index.html') }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript workspaces
        run: |
          npx tsc -p backend/mcp_server/tsconfig.json
          npx tsc -p backend/gateway/tsconfig.json

      - name: Build dashboard frontend
        if: steps.cache-dashboard.outputs.cache-hit != 'true'
        run: npm --prefix Frontend/dashboard ci --ignore-scripts && npm --prefix Frontend/dashboard run build

      - name: Build native core
        if: steps.cache-native-core.outputs.cache-hit != 'true'
        run: npm run native:build

      - name: Seed test fixtures
        run: node backend/scripts/dev/seed_master_fixture.js

      - name: Structure contracts
        run: npm run test:structure

      - name: Documentation audit
        run: npm run audit:documentation && node scripts/dev/filter_docs.js --strict

      - name: Full Node test suite
        run: npm test -- --test-concurrency=4
