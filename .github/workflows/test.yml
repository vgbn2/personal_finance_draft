name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-evidence:
    name: Committed source evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify committed archive across all package roots
        run: npm run verify:committed-archive -- --evidence-out "$RUNNER_TEMP/sovereign-source-evidence.json"

      - name: Retain source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-source-evidence
          path: ${{ runner.temp }}/sovereign-source-evidence.json
          if-no-files-found: error

  cpp-debug:
    name: C++ debug sanitizer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build/ci-debug -DCMAKE_BUILD_TYPE=Debug -DSOVEREIGN_ENABLE_SANITIZERS=ON -DSOVEREIGN_ENABLE_ONNX_RUNTIME=OFF

      - name: Build
        run: cmake --build build/ci-debug --parallel

      - name: Run CTest
        run: ctest --test-dir build/ci-debug/backend/core --output-on-failure
