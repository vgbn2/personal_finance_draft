prediction_market:
  enabled: true
  providers: ["kalshi", "polymarket"]
  events: ["fed_rate_cut_prob", "us_recession_prob", "inflation_above_target", "risk_off_spike"]
  note: "Layer-2 directional data for market expectations."

equities_options:
  enabled: true
  providers: ["cboe"]
  underlyings: ["SPY", "QQQ"]
  strikes: ["atm", "otm_1", "otm_2"]
  metrics: ["theta", "gamma", "iv", "open_interest", "volume", "bid", "ask", "mid", "delta", "vega", "rho"]

stock_options:
  enabled: true
  providers: ["cboe"]
  underlyings: ["AAPL", "MSFT"]
  strikes: ["atm", "otm_1", "otm_2"]
  metrics: ["theta", "gamma", "iv", "open_interest", "volume", "bid", "ask", "mid", "delta", "vega", "rho"]

sentiment:
  enabled: false
  providers: ["cryptopanic", "newsapi"]
  fields: ["news_score", "news_velocity", "risk_on_off", "fear_and_greed", "topic_sentiment"]

macro_alt:
  enabled: false
  providers: ["truflation"]
  series: ["US_CPI_HEADLINE", "US_CPI_FOOD", "US_CPI_HOUSING", "US_CPI_ENERGY", "US_PCE_HEADLINE"]

onchain:
  enabled: false
  providers: ["glassnode", "cryptoquant"]
  metrics: ["exchange_netflow_btc", "exchange_netflow_eth", "sopr_btc", "sopr_eth", "active_addresses_btc", "active_addresses_eth"]
