    trades: 1918
    sharpe_ratio: 1.43
    max_drawdown: 0.0449
    win_rate: 0.556
    net_return: 0.2170
    first_trade_enter: "1997-09-19T00:00:00.000Z"
    last_trade_exit: "2009-09-24T00:00:00.000Z"
    trading_window: "19/09/97 to 24/09/09"
  promotion:
    require_backtest: true
    require_walk_forward: true
    require_paper_trade: true
    review_required: true
  notes: []
