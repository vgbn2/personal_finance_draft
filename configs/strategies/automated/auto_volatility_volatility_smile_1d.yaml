name: auto_volatility_volatility_smile_1d
kind: volatility
family: volatility
lane: single_asset
role: strategy
status: active
enabled: true
model: volatility_breakout_v0
timeframe: 1d
sections:
  hypothesis: "Volatility smile skew regime shift: Asymmetric implied-versus-realized volatility expansion indicating structural trend continuation."
  universe:
    - "SPY"
    - "QQQ"
    - "BTCUSDT"
    - "ETHUSDT"
  signals:
    entry: "Bollinger Bandwidth expansion > 2.0x 20-day median with ATR breakout"
    exit: "Bandwidth mean reversion or trailing 3.5% stop loss"
  data:
    required_sources:
      - price_volume
      - sentiment
    validation: strict
  features:
    technical:
      - "atr"
      - "bollinger"
      - "hv"
      - "volatility"
      - "return_fast"
    relative: []
    orderflow: []
    custom: []
  indicators:
    atr: true
    bollinger: true
    hv: true
    volatility: true
    return_fast: true
  indicator_periods:
    returnFast: 1
    returnSlow: 5
    volatility: 20
    rsi: 14
    atr: 14
    bollinger: 20
  risk:
    signal_threshold: 0.65
    max_holding_days: 7
    risk_weight: 0.08
    stop_loss_pct: 0.035
    take_profit_pct: 0.08
    max_drawdown_limit: 0.2
    dynamic_sizing:
      min_notional_floor: 150
      min_equity_fraction: 0.007
      allocation_model: fixed_fractional
