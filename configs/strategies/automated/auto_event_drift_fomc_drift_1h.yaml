name: auto_event_drift_fomc_drift_1h
kind: event_drift
family: event_drift
lane: single_asset
role: strategy
status: active
enabled: true
model: gradient_boosted_trees_v0
timeframe: 1h
sections:
  hypothesis: "Post-FOMC announcement drift: Macro rate announcement drift continuing across major equity index benchmarks."
  universe:
    - "SPY"
    - "QQQ"
    - "DIA"
    - "IWM"
  signals:
    entry: "Macro announcement return expansion > 1.2% with MACD trend confirmation"
    exit: "MACD trend exhaustion or 5-bar horizon timeout"
  data:
    required_sources:
      - price_volume
      - sentiment
    validation: strict
  features:
    technical:
      - "return_fast"
      - "return_slow"
      - "macd"
      - "atr"
      - "volatility"
    relative: []
    orderflow: []
    custom: []
  indicators:
    return_fast: true
    return_slow: true
    macd: true
    atr: true
    volatility: true
  indicator_periods:
    returnFast: 1
    returnSlow: 5
    volatility: 20
    rsi: 14
    atr: 14
    bollinger: 20
  risk:
    signal_threshold: 0.65
    max_holding_days: 5
    risk_weight: 0.1
    stop_loss_pct: 0.025
    take_profit_pct: 0.06
    max_drawdown_limit: 0.2
    dynamic_sizing:
      min_notional_floor: 150
      min_equity_fraction: 0.007
      allocation_model: fixed_fractional
    fail_closed: true
  ml_meta_labeling:
    enabled: true
    model: xgboost_v1
    serving_manifest: "storage/models/serving_manifest.txt"
    feature_frame: "storage/data/ml/feature_frame.csv"
    prediction_backend: "deterministic_baseline"
    feature_columns: 38
    filter: "meta_label != 0"
  regime:
    filter_enabled: true
    target_regime: "calm_trend"
    cross_family_anchors:
      - "GOLD"
      - "OIL"
      - "USDJPY"
  backtest:
    engine: "sovereign_cpp_core"
    trades: 5869
    sharpe_ratio: -1.34
    max_drawdown: 0.1039
    win_rate: 0.468
    net_return: -0.0986
    first_trade_enter: "2020-07-29T15:00:00.000Z"
    last_trade_exit: "2021-01-22T14:00:00.000Z"
    trading_window: "29/07/20 to 22/01/21"
  promotion:
    require_backtest: true
    require_walk_forward: true
    require_paper_trade: true
    review_required: true
  notes: []
