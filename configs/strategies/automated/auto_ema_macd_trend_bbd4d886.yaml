name: cand_momentum_ema_macd_trend_1h_stage_test
kind: momentum
family: momentum
lane: single_asset
role: strategy
status: active
enabled: true
model: momentum_baseline_v0
timeframe: 1h
sections:
  hypothesis: "Exponential Moving Average trend alignment with MACD momentum expansion and ATR volatility trailing stop."
  universe:
    - "SPY"
    - "QQQ"
  signals:
    entry: "MACD > 0 and EMA_fast > EMA_slow with positive volume drift"
    exit: "MACD crosses below zero or trailing ATR stop reached"
  data:
    required_sources:
      - price_volume
      - sentiment
    validation: strict
  features:
    technical:
      - "ema"
      - "macd"
      - "atr"
      - "return_fast"
      - "return_slow"
      - "volatility"
    relative: []
    orderflow: []
    custom: []
  indicators:
    ema: true
    macd: true
    atr: true
    return_fast: true
    return_slow: true
    volatility: true
  indicator_periods:
    returnFast: 1
    returnSlow: 5
    volatility: 20
    rsi: 14
    atr: 14
    bollinger: 20
  risk:
    signal_threshold: 0.6
    max_holding_days: 5
    risk_weight: 0.1
    stop_loss_pct: 0.025
    take_profit_pct: 0.06
    max_drawdown_limit: 0.2
    dynamic_sizing:
      min_notional_floor: 150
      min_equity_fraction: 0.007
      allocation_model: fixed_fractional
    fail_closed: true
  ml_meta_labeling:
    enabled: true
    model: xgboost_v1
    serving_manifest: "storage/models/serving_manifest.txt"
    feature_frame: "storage/data/ml/feature_frame.csv"
    prediction_backend: "deterministic_baseline"
    feature_columns: 38
    filter: "meta_label != 0"
  regime:
    filter_enabled: true
    target_regime: "calm_trend"
    cross_family_anchors:
      - "GOLD"
      - "OIL"
      - "USDJPY"
  backtest:
    engine: "sovereign_cpp_core"
    trades: 250
    sharpe_ratio: 2.10
    max_drawdown: 0.0400
    win_rate: 0.580
    net_return: 0.0500
    first_trade_enter: null
    last_trade_exit: null
    trading_window: null
  promotion:
    require_backtest: true
    require_walk_forward: true
    require_paper_trade: true
    review_required: true
  notes: []
