name: auto_stat_arb_etf_basket_1h
kind: stat_arb
family: stat_arb
lane: single_asset
role: strategy
status: active
enabled: true
model: knn_pattern_v0
timeframe: 1h
sections:
  hypothesis: "Statistical arbitrage across cointegrated ETF baskets exploiting mean-reverting tracking spread deviations."
  universe:
    - "SPY"
    - "QQQ"
    - "IWM"
    - "DIA"
  signals:
    entry: "Basket cointegration spread z-score > 2.0 with volatility filter confirmation"
    exit: "Z-score reversion to zero or stop loss at 3.0%"
  data:
    required_sources:
      - price_volume
      - sentiment
    validation: strict
  features:
    technical:
      - "zscore"
      - "correlation"
      - "return_fast"
      - "return_slow"
      - "volatility"
    relative: []
    orderflow: []
    custom: []
  indicators:
    zscore: true
    correlation: true
    return_fast: true
    return_slow: true
    volatility: true
  indicator_periods:
    returnFast: 1
    returnSlow: 5
    volatility: 20
    rsi: 14
    atr: 14
    bollinger: 20
  risk:
    signal_threshold: 0.65
    max_holding_days: 5
    risk_weight: 0.08
    stop_loss_pct: 0.03
    take_profit_pct: 0.07
    max_drawdown_limit: 0.2
    dynamic_sizing:
      min_notional_floor: 150
      min_equity_fraction: 0.007
      allocation_model: fixed_fractional
    fail_closed: true
  ml_meta_labeling:
    enabled: true
    model: xgboost_v1
    serving_manifest: "storage/models/serving_manifest.txt"
    feature_frame: "storage/data/ml/feature_frame.csv"
    prediction_backend: "deterministic_baseline"
    feature_columns: 38
    filter: "meta_label != 0"
  regime:
    filter_enabled: true
    target_regime: "calm_trend"
    cross_family_anchors:
      - "GOLD"
      - "OIL"
      - "USDJPY"
  backtest:
    engine: "sovereign_cpp_core"
    trades: 5869
    sharpe_ratio: -1.34
    max_drawdown: 0.0840
    win_rate: 0.468
    net_return: -0.0797
    first_trade_enter: "2020-07-29T15:00:00.000Z"
    last_trade_exit: "2021-01-22T14:00:00.000Z"
    trading_window: "29/07/20 to 22/01/21"
  promotion:
    require_backtest: true
    require_walk_forward: true
    require_paper_trade: true
    review_required: true
  notes: []
