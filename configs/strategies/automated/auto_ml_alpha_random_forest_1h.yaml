name: auto_ml_alpha_random_forest_1h
kind: ml_alpha
family: ml_alpha
lane: single_asset
role: strategy
status: active
enabled: true
model: random_forest_v0
timeframe: 1h
sections:
  hypothesis: "Ensemble decision forest: Non-linear interaction between volatility, return skew, and momentum indicators mapped to forward return expectations."
  universe:
    - "SPY"
    - "QQQ"
    - "AAPL"
    - "MSFT"
  signals:
    entry: "Random Forest ensemble majority vote probability >= 0.65 for positive forward return"
    exit: "Ensemble probability drops below 0.50 or 5-day horizon expires"
  data:
    required_sources:
      - price_volume
      - sentiment
    validation: strict
  features:
    technical:
      - "rf_features"
      - "return_fast"
      - "return_slow"
      - "volatility"
      - "atr"
    relative: []
    orderflow: []
    custom: []
  indicators:
    rf_features: true
    return_fast: true
    return_slow: true
    volatility: true
    atr: true
  indicator_periods:
    returnFast: 1
    returnSlow: 5
    volatility: 20
    rsi: 14
    atr: 14
    bollinger: 20
  risk:
    signal_threshold: 0.65
    max_holding_days: 5
    risk_weight: 0.1
    stop_loss_pct: 0.03
    take_profit_pct: 0.07
    max_drawdown_limit: 0.2
    dynamic_sizing:
      min_notional_floor: 150
      min_equity_fraction: 0.007
      allocation_model: fixed_fractional
    fail_closed: true
  ml_meta_labeling:
    enabled: true
    model: xgboost_v1
    serving_manifest: "storage/models/serving_manifest.txt"
    feature_frame: "storage/data/ml/feature_frame.csv"
    prediction_backend: "deterministic_baseline"
    feature_columns: 38
    filter: "meta_label != 0"
  regime:
    filter_enabled: true
    target_regime: "calm_trend"
    cross_family_anchors:
      - "GOLD"
      - "OIL"
      - "USDJPY"
  backtest:
    engine: "sovereign_cpp_core"
    trades: 7018
    sharpe_ratio: -1.06
    max_drawdown: 0.1231
    win_rate: 0.475
    net_return: -0.1109
    first_trade_enter: "2020-07-29T15:00:00.000Z"
    last_trade_exit: "2021-02-01T20:00:00.000Z"
    trading_window: "29/07/20 to 01/02/21"
  promotion:
    require_backtest: true
    require_walk_forward: true
    require_paper_trade: true
    review_required: true
  notes: []
