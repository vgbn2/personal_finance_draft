# Private research host. Plain Compose startup is web-only. The central updater
# explicitly enables the writer profile; paper, monitoring, and research loops
# require their own profiles. Keep SOVEREIGN_WEB_BIND private.

x-common-build: &common-build
  context: ../..
  dockerfile: infra/docker/Dockerfile
  args:
    SOVEREIGN_SOURCE_REVISION: ${SOVEREIGN_SOURCE_REVISION:-unverified}
    SOVEREIGN_SOURCE_TREE: ${SOVEREIGN_SOURCE_TREE:-unverified}

x-central-runtime: &central-runtime
  NODE_ENV: production
  SOVEREIGN_DEPLOYMENT_PROFILE: ${SOVEREIGN_DEPLOYMENT_PROFILE:-central-host}
  SOVEREIGN_RUNTIME_MODE: cloud-compute
  LIVE_TRADING: "false"
  SOVEREIGN_EXECUTION_AUTHORIZED: "false"

services:
  web:
    build: *common-build
    image: ${SOVEREIGN_IMAGE_REF:-personal_finance:latest}
    env_file:
      - path: ${SOVEREIGN_WEB_ENV_FILE:-../../.env.services/web.env}
        required: true
    environment:
      <<: *central-runtime
      SOVEREIGN_WEB_HOST: 0.0.0.0
      SOVEREIGN_WEB_PORT: 8787
      SOVEREIGN_CACHE_TTL_MS: 30000
      SOVEREIGN_CACHE_MAX_ENTRIES: 100
    ports:
      - "${SOVEREIGN_WEB_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - ../../storage:/app/storage
      - ../../workspace:/app/workspace
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    profiles: [paper]
    build: *common-build
    image: ${SOVEREIGN_IMAGE_REF:-personal_finance:latest}
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - path: ${SOVEREIGN_BOT_ENV_FILE:-../../.env.services/bot.env}
        required: true
    environment: *central-runtime
    volumes:
      - ../../storage:/app/storage
    restart: unless-stopped
    # The image's HEALTHCHECK probes :8787/health, but bot runs no HTTP server —
    # disable it here so `docker compose ps` doesn't report a false "unhealthy".
    healthcheck:
      disable: true
    # The CLI owns the single global/personal/admin interval resolver. Its default
    # effective paper-bot cadence is one minute; SOVEREIGN_ADMIN_BOT_INTERVAL_MIN
    # may impose a slower host-wide minimum.
    command:
      - /bin/sh
      - -c
      - |
        node backend/cli/sovereign_cli.js run bot paper --strategy low_prob_dip

  bot-alpaca-paper:
    profiles: [paper-alpaca]
    build: *common-build
    image: ${SOVEREIGN_IMAGE_REF:-personal_finance:latest}
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - path: ${SOVEREIGN_BOT_ALPACA_PAPER_ENV_FILE:-../../.env.services/bot-alpaca-paper.env}
        required: true
    environment: *central-runtime
    volumes:
      - ../../storage:/app/storage
    restart: unless-stopped
    healthcheck:
      disable: true
    # Alpaca Paper automation loop: scans registered strategies against Alpaca Paper
    # at a configurable interval (default 15 minutes). The CLI owns the loop; this
    # service wraps it with restart and duplicate-loop detection.
    command:
      - /bin/sh
      - -c
      - |
        INTERVAL=$${ALPACA_PAPER_INTERVAL_MIN:-15}
        TRUST=$${ALPACA_PAPER_MIN_TRUST_SCORE:-70}
        NOTIONAL=$${ALPACA_PAPER_MAX_NOTIONAL:-25}
        exec node backend/cli/sovereign_cli.js run bot alpaca-paper \
          --interval "$$INTERVAL" \
          --min-trust-score "$$TRUST" \
          --paper-max-notional "$$NOTIONAL"

  backfill:
    profiles: [writer]
    build: *common-build
    image: ${SOVEREIGN_IMAGE_REF:-personal_finance:latest}
    env_file:
      - path: ${SOVEREIGN_BACKFILL_ENV_FILE:-../../.env.services/backfill.env}
        required: true
    environment:
      <<: *central-runtime
      # Headroom for the merge-write path: an incremental crypto/equity cycle still
      # reads the existing deep 1m bin (millions of rows) to merge-protect it. The
      # per-lane concurrency cap keeps this bounded, but raise the V8 old-space ceiling
      # above the ~4GB default so a long-running daemon never trips an OOM at the edge.
      NODE_OPTIONS: --max-old-space-size=6144
    volumes:
      - ../../storage:/app/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    # grain (1m crypto/equities, 5m Yahoo families) and rolled up to coarser TFs. It is
    # cache-aware (skips fresh symbols) and runs no HTTP server, so disable the image's
    # :8787 healthcheck to avoid a false "unhealthy".
    healthcheck:
      disable: true
    # The daemon loops internally every BACKFILL_INTERVAL_SECS (default 1800s); the
    # restart policy covers crashes. Set BACKFILL_INTERVAL_SECS in .env to override.
    command:
      - /bin/sh
      - -c
      - |
        INTERVAL=$${BACKFILL_INTERVAL_SECS:-1800}
        node backend/cli/sovereign_cli.js backfill-daemon --interval-secs $$INTERVAL

  portfolio-monitor:
    profiles: [monitoring]
    build: *common-build
    image: ${SOVEREIGN_IMAGE_REF:-personal_finance:latest}
    depends_on:
      backfill:
        condition: service_started
    env_file:
      - path: ${SOVEREIGN_PORTFOLIO_MONITOR_ENV_FILE:-../../.env.services/portfolio-monitor.env}
        required: true
    environment: *central-runtime
    volumes:
      - ../../storage:/app/storage
    restart: unless-stopped
    healthcheck:
      disable: true
    command:
      - /bin/sh
      - -c
      - |
        exec node backend/cli/sovereign_cli.js portfolio-monitor --json \
          --scope "$${PORTFOLIO_MONITOR_SCOPE:-both}" \
          --alpaca-scope "$${PORTFOLIO_MONITOR_ALPACA_SCOPE:-paper}" \
          --interval-secs "$${PORTFOLIO_MONITOR_INTERVAL_SECS:-60}" \
          --timeout-ms "$${PORTFOLIO_MONITOR_TIMEOUT_MS:-45000}"

  host-health:
    profiles: [monitoring]
    build: *common-build
    image: ${SOVEREIGN_IMAGE_REF:-personal_finance:latest}
    depends_on:
      backfill:
        condition: service_started
    env_file:
      - path: ${SOVEREIGN_HOST_HEALTH_ENV_FILE:-../../.env.services/host-health.env}
        required: true
    environment: *central-runtime
    volumes:
      - ../../storage:/app/storage
    restart: unless-stopped
    healthcheck:
      disable: true
    command:
      - /bin/sh
      - -c
      - |
        exec node backend/scripts/ops/host_health.js --watch \
          --no-runner \
          --interval-secs "$${HOST_HEALTH_INTERVAL_SECS:-300}" \
          --ts-max-age-min "$${HOST_HEALTH_TS_MAX_AGE_MIN:-120}" \
          --min-free-gb "$${HOST_HEALTH_MIN_FREE_GB:-10}" \
          --min-free-percent "$${HOST_HEALTH_MIN_FREE_PERCENT:-10}"

  host-backup:
    profiles: [monitoring]
    build: *common-build
    image: ${SOVEREIGN_IMAGE_REF:-personal_finance:latest}
    env_file:
      - path: ${SOVEREIGN_HOST_BACKUP_ENV_FILE:-../../.env.services/host-backup.env}
        required: true
    environment: *central-runtime
    volumes:
      - ../../storage:/app/storage
    restart: unless-stopped
    healthcheck:
      disable: true
    command:
      - /bin/sh
      - -c
      - |
        exec node backend/scripts/ops/host_backup.js --watch \
          --interval-secs "$${HOST_BACKUP_INTERVAL_SECS:-86400}" \
          --destination "$${HOST_BACKUP_ROOT:-/app/storage/backups/host}" \
          --retention-days "$${HOST_BACKUP_RETENTION_DAYS:-30}" \
          --max-count "$${HOST_BACKUP_MAX_COUNT:-14}"

  polymarket-research:
    profiles: [research]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        SOVEREIGN_SOURCE_REVISION: ${SOVEREIGN_SOURCE_REVISION:-unverified}
        SOVEREIGN_SOURCE_TREE: ${SOVEREIGN_SOURCE_TREE:-unverified}
    image: ${SOVEREIGN_IMAGE_REF:-personal_finance:latest}
    env_file:
      - path: ${SOVEREIGN_POLYMARKET_RESEARCH_ENV_FILE:-../../.env.services/polymarket-research.env}
        required: true
    environment: *central-runtime
    volumes:
      - ../../storage:/app/storage
    restart: unless-stopped
    healthcheck:
      disable: true
    command:
      - /bin/sh
      - -c
      - |
        if [ -z "$${POLYMARKET_RESEARCH_SCOPE_FILE}" ]; then
          echo "POLYMARKET_RESEARCH_SCOPE_FILE is required" >&2
          exit 1
        fi
        INTERVAL=$${POLYMARKET_RESEARCH_INTERVAL_SECS:-300}
        while true; do
          node backend/cli/sovereign_cli.js polymarket history schedule --scope-file "$${POLYMARKET_RESEARCH_SCOPE_FILE}" --execute --once --json --poll-seconds $${POLYMARKET_RESEARCH_INTERVAL_SECS:-300} --max-tokens $${POLYMARKET_RESEARCH_MAX_TOKENS:-20} --retention-days $${POLYMARKET_RESEARCH_RETENTION_DAYS:-30} --max-rows-per-token $${POLYMARKET_RESEARCH_MAX_ROWS_PER_TOKEN:-5000} --max-archive-bytes $${POLYMARKET_RESEARCH_MAX_ARCHIVE_BYTES:-5368709120} || exit $$?
          sleep $$INTERVAL
        done
