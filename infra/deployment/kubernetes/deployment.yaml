apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-web
  labels:
    app: sovereign
    component: web
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: sovereign
      component: web
  template:
    metadata:
      labels:
        app: sovereign
        component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/vgbn2/personal_finance_draft-web:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - backend/api/app.js
          envFrom:
            - configMapRef:
                name: sovereign-web-config
          env:
            - name: SOVEREIGN_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sovereign-supabase
                  key: url
            - name: SOVEREIGN_SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: sovereign-supabase
                  key: publishable_key
            - name: SOVEREIGN_SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sovereign-supabase
                  key: secret_key
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
